# Nightliner v0.4 Windows MVP config

models:
  light_command: null
  radio_mode: deepseek-chat
  chat_mode: deepseek-chat        # 日常对话:V3,快+便宜
  consolidation: deepseek-reasoner # 周度收敛:R1,深度推理
  cold_start: deepseek-reasoner    # 一次性冷启动:R1
  # 备选(代理回归后可切回 Claude 做 A/B):
  # chat_mode: claude-sonnet-4-6
  # cold_start: claude-opus-4-7

take_song:
  library_prefer_pct: 70
  recommend_channel_pct: 20
  wildcard_pct: 10
  archeology_mode_must_be_library_bound: true

queue:
  default_length: 10
  min_length: 5
  max_length: 30
  segment_size: 5

playback:
  primary_source: netease
  fallback_to_netease: false

ncm:
  api_base: http://localhost:3000
  # 音质档:standard(128k) / higher(192k) / exhigh(320k) / lossless(FLAC,VIP) / hires(VIP)
  song_url_level: exhigh

consolidation:
  enabled: false

signal_thresholds:
  strong_skip_sec: 30
  weak_skip_pct: 0.5
  near_complete_pct: 0.9
  cooldown_after_too_familiar_days: 90

server:
  port: 8080
  host: 127.0.0.1

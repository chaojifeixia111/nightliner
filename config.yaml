# Nightliner v0.4 Windows MVP config

models:
  light_command: null
  # 全部用 V4 非思考模式(取消 reasoner / 思考模式)
  radio_mode: deepseek-v4-flash
  chat_mode: deepseek-v4-flash      # 日常对话:V4 flash,快(~10s),便宜
  consolidation: deepseek-v4-pro    # 周度收敛:V4 pro,更强但仍非思考
  cold_start: deepseek-v4-pro       # 一次性冷启动:V4 pro
  # 备选(代理回归后可切回 Claude 做 A/B):
  # chat_mode: claude-sonnet-4-6
  # cold_start: claude-opus-4-7
  # 思考模式备选(慢但深度强,1 次冷启动用一下也行):
  # cold_start: deepseek-reasoner

take_song:
  library_prefer_pct: 70
  recommend_channel_pct: 20
  wildcard_pct: 10
  archeology_mode_must_be_library_bound: true

queue:
  default_length: 10
  min_length: 5
  max_length: 30
  segment_size: 5

playback:
  primary_source: netease
  fallback_to_netease: false

ncm:
  api_base: http://localhost:3000
  # 音质档:standard(128k) / higher(192k) / exhigh(320k) / lossless(FLAC,VIP) / hires(VIP)
  song_url_level: exhigh

consolidation:
  enabled: false

signal_thresholds:
  strong_skip_sec: 30
  weak_skip_pct: 0.5
  near_complete_pct: 0.9
  cooldown_after_too_familiar_days: 90

server:
  port: 8080
  host: 127.0.0.1

# RAG (BGE-M3 本地 embedding + sqlite-vec 检索) v0.5
rag:
  enabled: true
  retrieval:
    song_top_k: 30        # 曲库召回 (主要 prompt 体积来源)
    feedback_top_k: 8     # 反馈召回
    life_stage_top_k: 3
    taste_top_k: 3
    mood_rule_top_k: 2
    vibe_anchor_top_k: 5
    chat_turn_top_k: 3    # 语义历史轮 (近因仍走 messages[] 多轮回放)
  embedding:
    model: 'Xenova/bge-m3'  # 本地 ONNX q8 量化
    dim: 1024
    quantization: 'q8'
  budget_enforcement:
    enabled: true
    deviation_threshold: 0.10   # source_pool 偏差 >10% 触发 retry
    max_retries: 1

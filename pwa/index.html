<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NightlinerFM</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=VT323&family=JetBrains+Mono:wght@300;400;500&family=Press+Start+2P&display=swap" rel="stylesheet" />
  <style>
    :root {
      /* primary: white — for "live / now / focus" elements */
      --accent: #f4f7fc;
      --accent-dim: #aab4c8;

      /* atmosphere: deep blue — panels, borders, glow */
      --bg: #070b14;
      --panel: #0d1322;
      --panel-2: #111a2e;
      --border: #1c2a4a;
      --border-soft: #14203a;

      /* text */
      --text: #dde4f0;
      --text-dim: #6b7894;

      /* atmospheric blue accent (used sparingly: badges, progress fill, hover glow) */
      --blue: #4a7fdb;
      --blue-dim: #2c4a85;
      --blue-glow: rgba(74, 127, 219, 0.18);

      --warn: #d4a64f;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: 'JetBrains Mono', monospace;
      background-color: var(--bg);
      background-image:
        radial-gradient(ellipse 80% 50% at 50% 0%, var(--blue-glow), transparent 60%),
        radial-gradient(circle, #1a2235 1px, transparent 1px);
      background-size: auto, 24px 24px;
      background-repeat: no-repeat, repeat;
      color: var(--text);
      min-height: 100vh;
    }

    #app {
      max-width: 720px;
      margin: 0 auto;
      padding: 0 16px 80px;
    }

    /* selection */
    ::selection { background: var(--blue-dim); color: var(--accent); }
  </style>
</head>
<body>
  <div id="app"></div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
